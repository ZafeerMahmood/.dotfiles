# AeroSpace config, ported from GlazeWM (~/.glzr/glazewm/config.yaml).
# Same alt-based keys. See KEYBINDINGS.md for the Windows -> Mac table.

start-at-login = true

# NOTE: sketchybar + borders run as brew services (start at login), borders settings live in ~/.config/borders/bordersrc
after-startup-command = []

# Tell SketchyBar when workspace focus changes
exec-on-workspace-change = [
  '/bin/bash', '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

accordion-padding = 30

# GlazeWM focus_follows_cursor: false (AeroSpace default, nothing to set)
# GlazeWM cursor_jump on monitor_focus
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

# NOTE: login items get a bare PATH, so exec commands could not find sketchybar
[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[key-mapping]
preset = 'qwerty'

# GlazeWM gaps: inner 6px, outer top 3 / right 6 / bottom 6 / left 6.
# Top adds the 40px SketchyBar height so windows sit under the bar.
# NOTE: calibration knob, tweak top if the bar overlaps on the notch screen
[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 6
outer.bottom = 6
outer.right = 6
# NOTE: built-in screen reserves 29px already, 40 bar - 29 + 4 gap = 15
outer.top = [{ monitor."built-in" = 15 }, 40]

[mode.main.binding]
# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

# Move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

# Resize (GlazeWM used 2%, AeroSpace uses pixels; 30px ~ 2% of a laptop screen)
alt-u = 'resize width -30'
alt-p = 'resize width +30'
alt-o = 'resize height +30'
alt-i = 'resize height -30'

alt-r = ['mode resize', 'exec-and-forget sketchybar --set binding_mode drawing=on label=resize']

# Pause / resume all window management (bindings with `enable` stay active)
alt-shift-p = 'enable toggle'

# Toggle tiling direction of the current container
alt-v = 'layout tiles horizontal vertical'

# GlazeWM wm-cycle-focus has no exact match; cycles through windows instead
alt-space = 'focus --boundaries-action wrap-around-the-workspace dfs-next'

alt-shift-space = 'layout floating tiling'
alt-t = 'layout tiling'
alt-m = 'macos-native-minimize'
alt-shift-q = 'close'
alt-shift-e = 'exec-and-forget osascript -e "quit app \"AeroSpace\""'
alt-shift-r = ['reload-config', 'exec-and-forget sketchybar --reload']

# GlazeWM wm-redraw has no match; flatten resets a messed up layout
alt-shift-w = 'flatten-workspace-tree'

# NOTE: swap WezTerm for whatever terminal you settle on (Ghostty, iTerm2, ...)
alt-enter = 'exec-and-forget open -na WezTerm'

# Workspace cycling
alt-s = 'workspace --wrap-around next'
alt-a = 'workspace --wrap-around prev'
alt-d = 'workspace-back-and-forth'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Move workspace to monitor in a direction, same as GlazeWM
alt-shift-a = 'move-workspace-to-monitor left'
alt-shift-f = 'move-workspace-to-monitor right'
alt-shift-d = 'move-workspace-to-monitor up'
alt-shift-s = 'move-workspace-to-monitor down'

# Move window to workspace and follow it
alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

[mode.resize.binding]
h = 'resize width -30'
left = 'resize width -30'
l = 'resize width +30'
right = 'resize width +30'
k = 'resize height +30'
up = 'resize height +30'
j = 'resize height -30'
down = 'resize height -30'
esc = ['mode main', 'exec-and-forget sketchybar --set binding_mode drawing=off']
enter = ['mode main', 'exec-and-forget sketchybar --set binding_mode drawing=off']

# Window rules (GlazeWM window_rules). Browser picture-in-picture floats.
[[on-window-detected]]
if.window-title-regex-substring = '(?i)picture.in.picture'
run = 'layout floating'

# NOTE: Office dialogs (GlazeWM EXCEL/WINWORD/POWERPNT rules) are auto-floated by
# AeroSpace since they are macOS dialogs. Add rules here if one tiles by mistake:
# [[on-window-detected]]
# if.app-id = 'com.microsoft.Excel'
# if.window-title-regex-substring = 'Format Cells'
# run = 'layout floating'
